<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StockFlow{% if title %} - {{ title }}{% endif %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary mb-4"><div class="container">
  <a class="navbar-brand" href="{% url 'dashboard' %}">StockFlow</a>
  <div><a class="text-white me-3" href="{% url 'product-list' %}">Produtos</a><a class="text-white me-3" href="{% url 'movement-list' %}">Estoque</a><a class="text-white" href="{% url 'order-list' %}">Pedidos</a></div>
</div></nav>
<main class="container">
{% for message in messages %}<div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>{% endfor %}
{% block content %}{% endblock %}
</main>
</body>
</html>
