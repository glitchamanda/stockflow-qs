{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between"><h1>Pedidos</h1><a class="btn btn-primary" href="{% url 'order-create' %}">Novo pedido</a></div><table class="table bg-white"><tr><th>ID</th><th>Data</th><th>Status</th><th>Total</th></tr>{% for order in orders %}<tr><td><a href="{% url 'order-detail' order.pk %}">#{{ order.pk }}</a></td><td>{{ order.created_at }}</td><td>{{ order.get_status_display }}</td><td>R$ {{ order.total }}</td></tr>{% empty %}<tr><td colspan="4">Nenhum pedido.</td></tr>{% endfor %}</table>{% endblock %}
