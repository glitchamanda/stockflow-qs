{% extends "base.html" %}{% block content %}<h1>{{ product.name }}</h1><dl><dt>SKU</dt><dd>{{ product.sku }}</dd><dt>Descrição</dt><dd>{{ product.description|default:"-" }}</dd><dt>Preço</dt><dd>R$ {{ product.price }}</dd><dt>Estoque</dt><dd>{{ product.stock_quantity }}</dd></dl><a class="btn btn-primary" href="{% url 'product-update' product.pk %}">Editar</a> <a class="btn btn-danger" href="{% url 'product-delete' product.pk %}">Excluir</a>{% endblock %}
